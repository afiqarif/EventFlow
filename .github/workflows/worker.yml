name: Build Worker

on:
  push:
    branches: [ main ]
    paths:
      - 'worker/**'
  pull_request:
    branches: [ main ]
    paths:
      - 'worker/**'
  workflow_dispatch: 

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: eventflow
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }} 
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step A: Build and export cache
      - name: Build and Cache Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: false 
          tags: |
            ghcr.io/${{ github.repository_owner }}/worker-service:latest
            ghcr.io/${{ github.repository_owner }}/worker-service:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step B: Push the pre-built image
      - name: Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ./worker
          file: ./worker/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/worker-service:latest
            ghcr.io/${{ github.repository_owner }}/worker-service:${{ github.sha }}
          cache-from: type=gha
