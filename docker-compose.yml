services:
  db:
    image: ankane/pgvector:latest
    container_name: eventflow_postgres
    environment:
      POSTGRES_USER: arif
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: eventflow
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./database/migrations:/docker-entrypoint-initdb.d
    restart: unless-stopped

  # C++ API Gateway service
  api-gateway:
    # build: ./gateway
    image:  ghcr.io/afiqarif/gateway-service:deff3baab0dab83340c93bb9c6bffac07d37ce5c
    container_name: eventflow_gateway
    environment:
      JWT_SECRET: ${JWT_SECRET}
      DB_HOST: db
      DB_USER: arif
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: eventflow
    ports:
      - "8080:8080"
    volumes:
      - ./gateway/config.template.json:/app/config.template.json
      - ./gateway/entrypoint.sh:/app/entrypoint.sh
      - ./gateway/logs:/app/logs
    depends_on:
      - db
    restart: unless-stopped

volumes:
  pgdata: